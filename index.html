<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Plan Editor</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="toolbar" role="toolbar" aria-label="Plan tools">
    <div class="brand">Home Plan</div>

    <div class="group" aria-label="Level">
      <select id="level-select" title="Level being edited (PageUp / PageDown)" aria-label="Level"></select>
      <button type="button" data-action="add-level" title="Add an empty level on top">+ Level</button>
    </div>

    <div class="group" aria-label="History">
      <button type="button" data-action="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button type="button" data-action="redo" title="Redo (Ctrl+Y)">Redo</button>
    </div>

    <div class="group segmented" aria-label="Layout">
      <button type="button" data-view="2d" title="2D plan full width">2D</button>
      <button type="button" data-view="split" title="Side by side">Split</button>
      <button type="button" data-view="3d" title="3D view full width">3D</button>
    </div>

    <div class="group" aria-label="File">
      <button type="button" data-action="fit" title="Fit plan in both views (F)">Fit</button>
      <button type="button" data-action="new" title="Start an empty plan">New</button>
      <button type="button" data-action="import" title="Load a plan from a JSON file">Import</button>
      <button type="button" data-action="export" title="Save the plan as a JSON file">Export</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="workspace" id="workspace" data-view="split">
    <aside class="palette" id="palette" aria-label="Primitives">
      <div class="palette-row">
        <button type="button" data-tool="select" title="Select and move (V)">Select <kbd>V</kbd></button>
        <button type="button" data-tool="split" title="Split a wall (S)">Split <kbd>S</kbd></button>
      </div>

      <details open>
        <summary>Walls &amp; floors</summary>
        <div class="palette-grid">
          <button type="button" data-tool="wall" title="Draw straight walls (W)">Wall <kbd>W</kbd></button>
          <button type="button" data-tool="curve" title="Draw a curved wall through points (C)">Curved wall <kbd>C</kbd></button>
          <button type="button" data-tool="barrier" title="Draw a low solid wall, 100 cm high (B)">Barrier <kbd>B</kbd></button>
          <button type="button" data-tool="barrier_glass" title="Draw a thin glass barrier, 100 cm high">Glass barrier</button>
          <button type="button" data-tool="barrier_railing" title="Draw a railing: a top bar on posts, 100 cm high">Railing</button>
          <button type="button" data-tool="floor" title="Draw a floor by clicking its corners (G)">Floor <kbd>G</kbd></button>
          <button type="button" data-tool="fill" title="Fill a closed room with a floor in one click (R)">Floor fill <kbd>R</kbd></button>
          <button type="button" data-tool="cutout" title="Cut a hole in a floor (H)">Floor cutout <kbd>H</kbd></button>
        </div>
      </details>

      <details>
        <summary>Windows</summary>
        <div class="palette-grid">
          <button type="button" data-tool="window" title="Window (1)">Window <kbd>1</kbd></button>
          <button type="button" data-tool="window_tall" title="Tall window (2)">Tall <kbd>2</kbd></button>
          <button type="button" data-tool="window_full" title="Full-height window (3)">Full height <kbd>3</kbd></button>
          <button type="button" data-tool="window_small" title="Small 30 x 30 window high in the wall (4)">Small <kbd>4</kbd></button>
          <button type="button" data-tool="window_double" title="Double window (5)">Double <kbd>5</kbd></button>
          <button type="button" data-tool="window_double_tall" title="Double tall window (6)">Double tall <kbd>6</kbd></button>
          <button type="button" data-tool="window_double_full" title="Double full-height window (7)">Double full <kbd>7</kbd></button>
        </div>
      </details>

      <details>
        <summary>Doors</summary>
        <div class="palette-grid">
          <button type="button" data-tool="door" title="Door (D)">Door <kbd>D</kbd></button>
          <button type="button" data-tool="door_double" title="Double door">Double door</button>
          <button type="button" data-tool="door_slide" title="Sliding door">Sliding door</button>
          <button type="button" data-tool="door_garage" title="Garage door">Garage door</button>
        </div>
      </details>

      <details>
        <summary>Stairs</summary>
        <div class="palette-grid">
          <button type="button" data-tool="stairs" title="Place stairs to the level above (T)">Stairs <kbd>T</kbd></button>
        </div>
      </details>

      <details>
        <summary>Furniture</summary>
        <div class="palette-grid">
          <p class="palette-empty">Nothing here yet.</p>
        </div>
      </details>
    </aside>

    <section class="pane pane-2d" aria-label="2D plan">
      <div class="pane-head">
        <span>Plan</span>
        <button type="button" class="pane-toggle" data-expand="2d" title="Expand or restore the 2D plan">Expand</button>
      </div>
      <div class="canvas-wrap">
        <canvas id="plan" tabindex="0" aria-label="Floor plan editor"></canvas>
        <div id="ctxmenu" class="ctxmenu" role="menu" hidden></div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <section class="pane pane-3d" aria-label="3D view">
      <div class="pane-head">
        <span>3D</span>
        <span class="pane-hint">Drag to orbit, right-drag to pan, scroll to zoom</span>
        <button type="button" class="pane-toggle" data-expand="3d" title="Expand or restore the 3D view">Expand</button>
      </div>
      <div class="view3d" id="view3d">
        <div class="view3d-msg" id="view3d-msg">Loading 3D view...</div>
      </div>
    </section>

    <aside class="props" id="props" aria-label="Properties">
      <div id="props-body"></div>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
